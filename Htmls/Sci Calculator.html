<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<style>
  :root {
    --bg: #0f141b;
    --panel: #161d27;
    --panel-2: #1d2632;
    --display-bg: #0b1015;
    --text: #e8eef6;
    --muted: #8b98a9;
    --accent: #3ea6ff;
    --accent-soft: #1e3a52;
    --op: #2a3542;
    --op-hover: #354352;
    --fn: #1a222d;
    --fn-hover: #232e3b;
    --eq: #3ea6ff;
    --eq-text: #04121f;
    --danger: #ff6b6b;
    --border: #263140;
    --shadow: rgba(0,0,0,0.45);
  }
  html[data-theme="light"] {
    --bg: #eef2f7;
    --panel: #ffffff;
    --panel-2: #f4f7fb;
    --display-bg: #f7fafd;
    --text: #16202b;
    --muted: #64748b;
    --accent: #1677ff;
    --accent-soft: #dbeaff;
    --op: #e6ecf4;
    --op-hover: #d7e0ec;
    --fn: #f0f4f9;
    --fn-hover: #e3eaf3;
    --eq: #1677ff;
    --eq-text: #ffffff;
    --danger: #d92d20;
    --border: #d6dfeb;
    --shadow: rgba(20,40,70,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: auto;
    transition: background 0.25s, color 0.25s;
  }

  .calc {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 24px 60px var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .display {
    background: var(--display-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 118px;
    justify-content: space-between;
  }

  .expr {
    font-size: 15px;
    color: var(--muted);
    min-height: 20px;
    text-align: right;
    word-break: break-all;
    font-family: "Consolas", "SF Mono", Menlo, monospace;
    letter-spacing: 0.3px;
    white-space: pre-wrap;
  }

  .result {
    font-size: 38px;
    font-weight: 600;
    text-align: right;
    word-break: break-all;
    font-family: "Consolas", "SF Mono", Menlo, monospace;
    line-height: 1.15;
    min-height: 44px;
  }

  .result.error { color: var(--danger); font-size: 26px; }

  .badges {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .badge:hover { background: var(--fn-hover); }
  .badge.on {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    background: var(--fn);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 4px;
    cursor: pointer;
    transition: background 0.12s, transform 0.06s, border-color 0.12s, color 0.12s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  button:hover { background: var(--fn-hover); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.fn {
    font-size: 14px;
    color: var(--muted);
  }
  button.fn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  button.op {
    background: var(--op);
    font-size: 19px;
  }
  button.op:hover { background: var(--op-hover); }

  button.eq {
    background: var(--eq);
    color: var(--eq-text);
    border-color: var(--eq);
    font-weight: 700;
  }
  button.eq:hover { filter: brightness(1.08); }

  button.del { color: var(--danger); }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .calc { padding: 12px; gap: 10px; border-radius: 16px; }
    .keys { gap: 6px; }
    button { font-size: 15px; padding: 12px 2px; border-radius: 10px; }
    button.fn { font-size: 12px; }
    .result { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="badges">
      <span class="badge" id="degBadge" title="Toggle degrees / radians">DEG</span>
      <span class="badge" id="memBadge" title="Memory indicator">M</span>
      <span class="badge" id="histBadge" title="Recall last result">ANS</span>
    </div>
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys" id="keys">
    <button class="fn active" data-action="deg">DEG</button>
    <button class="fn" data-action="sin">sin</button>
    <button class="fn" data-action="cos">cos</button>
    <button class="fn" data-action="tan">tan</button>
    <button class="fn del" data-action="clear">AC</button>

    <button class="fn" data-action="asin">sin⁻¹</button>
    <button class="fn" data-action="acos">cos⁻¹</button>
    <button class="fn" data-action="atan">tan⁻¹</button>
    <button class="fn" data-action="ln">ln</button>
    <button class="fn" data-action="log">log</button>

    <button class="fn" data-action="sqrt">√</button>
    <button class="fn" data-action="cbrt">∛</button>
    <button class="fn" data-action="pow">xʸ</button>
    <button class="fn" data-action="exp">eˣ</button>
    <button class="fn" data-action="fact">n!</button>

    <button class="fn" data-action="pi">π</button>
    <button class="fn" data-action="e">e</button>
    <button class="fn" data-action="inv">1/x</button>
    <button class="fn" data-action="abs">|x|</button>
    <button class="fn" data-action="del">⌫</button>

    <button class="fn" data-action="mc">MC</button>
    <button class="fn" data-action="mr">MR</button>
    <button class="fn" data-action="mplus">M+</button>
    <button class="fn" data-action="mminus">M−</button>
    <button class="fn" data-action="paren">( )</button>

    <button data-action="7">7</button>
    <button data-action="8">8</button>
    <button data-action="9">9</button>
    <button class="op" data-action="div">÷</button>
    <button class="op" data-action="percent">%</button>

    <button data-action="4">4</button>
    <button data-action="5">5</button>
    <button data-action="6">6</button>
    <button class="op" data-action="mul">×</button>
    <button class="op" data-action="pow2">x²</button>

    <button data-action="1">1</button>
    <button data-action="2">2</button>
    <button data-action="3">3</button>
    <button class="op" data-action="sub">−</button>
    <button class="op" data-action="ans">Ans</button>

    <button data-action="0">0</button>
    <button data-action="dot">.</button>
    <button class="op" data-action="sign">±</button>
    <button class="op" data-action="add">+</button>
    <button class="eq" data-action="eq">=</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var exprEl = document.getElementById("expr");
  var resultEl = document.getElementById("result");
  var degBadge = document.getElementById("degBadge");
  var memBadge = document.getElementById("memBadge");
  var histBadge = document.getElementById("histBadge");

  // State
  var expr = "";          // expression string with display tokens
  var lastResult = 0;     // Ans value
  var memory = 0;         // memory register
  var degMode = true;     // degrees vs radians
  var justEvaluated = false;

  // ---------- Tokenizer / Parser (recursive descent) ----------
  // Grammar:
  //   expr   := term (('+'|'-') term)*
  //   term   := unary (('*'|'/'|'%') unary)*
  //   unary  := ('-'|'+') unary | power
  //   power  := postfix ('^' unary)?         (right assoc)
  //   postfix:= primary ('!')*
  //   primary:= number | constant | '(' expr ')' | func '(' expr ')'
  //             | '√' unary | '∛' unary | '|' expr '|'

  function tokenize(s) {
    var tokens = [];
    var i = 0;
    var n = s.length;
    var lastWasValue = false;

    var funcs = ["asin", "acos", "atan", "sin", "cos", "tan", "ln", "log", "sqrt", "cbrt", "abs"];

    while (i < n) {
      var c = s[i];

      if (c === " " || c === ",") { i++; continue; }

      // numbers
      if (/[0-9.]/.test(c)) {
        var num = "";
        while (i < n && /[0-9.]/.test(s[i])) { num += s[i]; i++; }
        if ((num.match(/\./g) || []).length > 1 || num === ".") {
          throw new Error("Invalid number");
        }
        tokens.push({ type: "num", value: parseFloat(num) });
        lastWasValue = true;
        continue;
      }

      // constants
      if (c === "π") { tokens.push({ type: "num", value: Math.PI }); i++; lastWasValue = true; continue; }
      if (c === "e" && !/[a-zA-Z]/.test(s[i + 1] || "")) {
        // careful: 'e' could be part of function names; handled since funcs matched below
        tokens.push({ type: "num", value: Math.E }); i++; lastWasValue = true; continue;
      }

      // function names
      var matchedFn = null;
      for (var f = 0; f < funcs.length; f++) {
        var fn = funcs[f];
        if (s.substr(i, fn.length) === fn) { matchedFn = fn; break; }
      }
      if (matchedFn) {
        tokens.push({ type: "func", value: matchedFn });
        i += matchedFn.length;
        lastWasValue = false;
        continue;
      }

      // operators & symbols
      if ("+-*/^%!()|√∛".indexOf(c) !== -1) {
        // implicit multiplication: value followed by '(' or '|' or '√' or number
        if (lastWasValue && (c === "(" || c === "|" || c === "√" || c === "∛")) {
          tokens.push({ type: "op", value: "*" });
        }
        tokens.push({ type: "op", value: c });
        i++;
        lastWasValue = (c === ")" || c === "|" || c === "!");
        continue;
      }

      throw new Error("Invalid character: " + c);
    }
    return tokens;
  }

  function Parser(tokens) {
    this.tokens = tokens;
    this.pos = 0;
  }
  Parser.prototype.peek = function () { return this.tokens[this.pos]; };
  Parser.prototype.next = function () { return this.tokens[this.pos++]; };
  Parser.prototype.expect = function (val) {
    var t = this.next();
    if (!t || t.value !== val) throw new Error("Expected " + val);
    return t;
  };

  Parser.prototype.parse = function () {
    var v = this.parseExpr();
    if (this.pos < this.tokens.length) throw new Error("Unexpected token");
    return v;
  };

  Parser.prototype.parseExpr = function () {
    var v = this.parseTerm();
    while (this.peek() && this.peek().type === "op" && (this.peek().value === "+" || this.peek().value === "-")) {
      var op = this.next().value;
      var r = this.parseTerm();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  };

  Parser.prototype.parseTerm = function () {
    var v = this.parseUnary();
    while (this.peek() && this.peek().type === "op" && (this.peek().value === "*" || this.peek().value === "/" || this.peek().value === "%")) {
      var op = this.next().value;
      var r = this.parseUnary();
      if (op === "*") v = v * r;
      else if (op === "/") {
        if (r === 0) throw new Error("Division by zero");
        v = v / r;
      } else {
        v = v % r;
      }
    }
    return v;
  };

  Parser.prototype.parseUnary = function () {
    var t = this.peek();
    if (t && t.type === "op" && (t.value === "-" || t.value === "+")) {
      this.next();
      var v = this.parseUnary();
      return t.value === "-" ? -v : v;
    }
    return this.parsePower();
  };

  Parser.prototype.parsePower = function () {
    var base = this.parsePostfix();
    var t = this.peek();
    if (t && t.type === "op" && t.value === "^") {
      this.next();
      var exp = this.parseUnary(); // right assoc
      return Math.pow(base, exp);
    }
    return base;
  };

  Parser.prototype.parsePostfix = function () {
    var v = this.parsePrimary();
    while (this.peek() && this.peek().type === "op" && this.peek().value === "!") {
      this.next();
      v = factorial(v);
    }
    return v;
  };

  Parser.prototype.parsePrimary = function () {
    var t = this.next();
    if (!t) throw new Error("Unexpected end");

    if (t.type === "num") return t.value;

    if (t.type === "func") {
      var arg;
      var nt = this.peek();
      if (nt && nt.type === "op" && nt.value === "(") {
        this.next();
        arg = this.parseExpr();
        this.expect(")");
      } else {
        arg = this.parseUnary();
      }
      return applyFunc(t.value, arg);
    }

    if (t.type === "op") {
      if (t.value === "(") {
        var v = this.parseExpr();
        this.expect(")");
        return v;
      }
      if (t.value === "|") {
        var av = this.parseExpr();
        this.expect("|");
        return Math.abs(av);
      }
      if (t.value === "√") {
        var sv = this.parseUnary();
        if (sv < 0) throw new Error("√ of negative");
        return Math.sqrt(sv);
      }
      if (t.value === "∛") {
        var cv = this.parseUnary();
        return Math.cbrt(cv);
      }
      if (t.value === "-") {
        return -this.parseUnary();
      }
      if (t.value === "+") {
        return this.parseUnary();
      }
    }
    throw new Error("Unexpected token: " + t.value);
  };

  function factorial(x) {
    if (x < 0 || Math.floor(x) !== x) throw new Error("n! needs non-negative integer");
    if (x > 170) return Infinity;
    var r = 1;
    for (var i = 2; i <= x; i++) r *= i;
    return r;
  }

  function toRad(x) { return degMode ? x * Math.PI / 180 : x; }
  function fromRad(x) { return degMode ? x * 180 / Math.PI : x; }

  function applyFunc(name, x) {
    switch (name) {
      case "sin": return Math.sin(toRad(x));
      case "cos": return Math.cos(toRad(x));
      case "tan": {
        var r = Math.tan(toRad(x));
        return Math.abs(r) > 1e15 ? r : r;
      }
      case "asin":
        if (x < -1 || x > 1) throw new Error("Domain error");
        return fromRad(Math.asin(x));
      case "acos":
        if (x < -1 || x > 1) throw new Error("Domain error");
        return fromRad(Math.acos(x));
      case "atan": return fromRad(Math.atan(x));
      case "ln":
        if (x <= 0) throw new Error("Domain error");
        return Math.log(x);
      case "log":
        if (x <= 0) throw new Error("Domain error");
        return Math.log10(x);
      case "sqrt":
        if (x < 0) throw new Error("Domain error");
        return Math.sqrt(x);
      case "cbrt": return Math.cbrt(x);
      case "abs": return Math.abs(x);
      default: throw new Error("Unknown function");
    }
  }

  function evaluate(s) {
    var tokens = tokenize(s);
    if (tokens.length === 0) throw new Error("Empty");
    var p = new Parser(tokens);
    var v = p.parse();
    if (typeof v !== "number" || isNaN(v)) throw new Error("Invalid result");
    return v;
  }

  // ---------- Formatting ----------
  function formatNumber(v) {
    if (!isFinite(v)) return v > 0 ? "∞" : (v < 0 ? "−∞" : "NaN");
    if (Object.is(v, -0)) v = 0;
    var abs = Math.abs(v);
    var s;
    if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
      s = v.toExponential(9);
      // trim trailing zeros in mantissa
      s = s.replace(/\.?0+e/, "e");
    } else {
      s = parseFloat(v.toPrecision(12)).toString();
    }
    return s.replace(/-/g, "−");
  }

  // ---------- Display helpers ----------
  function updateDisplay() {
    exprEl.textContent = expr || "";
    if (expr === "") {
      resultEl.textContent = "0";
      resultEl.classList.remove("error");
    }
    degBadge.textContent = degMode ? "DEG" : "RAD";
    memBadge.classList.toggle("on", memory !== 0);
    histBadge.classList.toggle("on", lastResult !== 0);
    // live preview
    if (expr !== "" && !justEvaluated) {
      try {
        var v = evaluate(expr);
        resultEl.textContent = formatNumber(v);
        resultEl.classList.remove("error");
      } catch (e) {
        resultEl.textContent = "";
        resultEl.classList.remove("error");
      }
    }
  }

  // ---------- Actions ----------
  function insert(text) {
    if (justEvaluated) {
      // start fresh, but if user pressed operator, continue from Ans
      var isOp = /^[+\-*/^%]$/.test(text);
      if (isOp) {
        expr = "Ans" + text;
      } else {
        expr = "";
      }
      justEvaluated = false;
    }
    expr += text;
    updateDisplay();
  }

  function clearAll() {
    expr = "";
    justEvaluated = false;
    resultEl.textContent = "0";
    resultEl.classList.remove("error");
    updateDisplay();
  }

  function backspace() {
    if (justEvaluated) { justEvaluated = false; }
    // remove trailing function name if present
    var fns = ["asin", "acos", "atan", "sin", "cos", "tan", "sqrt", "cbrt", "log", "ln", "abs"];
    for (var i = 0; i < fns.length; i++) {
      if (expr.endsWith(fns[i])) {
        expr = expr.slice(0, -fns[i].length);
        updateDisplay();
        return;
      }
    }
    expr = expr.slice(0, -1);
    updateDisplay();
  }

  function compute() {
    if (expr === "") return;
    try {
      var v = evaluate(expr);
      var formatted = formatNumber(v);
      exprEl.textContent = expr + " =";
      resultEl.textContent = formatted;
      resultEl.classList.remove("error");
      lastResult = v;
      justEvaluated = true;
      expr = "";
      // keep displayed expression until next key
      memBadge.classList.toggle("on", memory !== 0);
      histBadge.classList.toggle("on", lastResult !== 0);
    } catch (e) {
      resultEl.textContent = e.message || "Error";
      resultEl.classList.add("error");
      justEvaluated = false;
    }
  }

  function currentValue() {
    try {
      if (expr === "") return lastResult;
      return evaluate(expr);
    } catch (e) {
      return null;
    }
  }

  function wrapFunction(fnText) {
    // If expression ends with a complete value, wrap? Simpler: append function + '('
    if (justEvaluated) {
      // apply to Ans
      expr = fnText + "(Ans";
      justEvaluated = false;
      updateDisplay();
      return;
    }
    // If there is a trailing number, wrap it: e.g. "5" -> "sin(5"
    var m = expr.match(/(\d+\.?\d*|π|e|Ans)$/);
    if (m) {
      expr = expr.slice(0, expr.length - m[1].length) + fnText + "(" + m[1];
    } else {
      expr += fnText + "(";
    }
    updateDisplay();
  }

  function applyAction(action) {
    switch (action) {
      case "0": case "1": case "2": case "3": case "4":
      case "5": case "6": case "7": case "8": case "9":
        insert(action); break;
      case "dot": insert("."); break;
      case "add": insert("+"); break;
      case "sub": insert("-"); break;
      case "mul": insert("*"); break;
      case "div": insert("/"); break;
      case "pow": insert("^"); break;
      case "percent": insert("%"); break;
      case "paren":
        // smart paren: open if balanced or last char is operator/open
        var opens = (expr.match(/\(/g) || []).length;
        var closes = (expr.match(/\)/g) || []).length;
        var last = expr.slice(-1);
        if (opens > closes && /[0-9πe)!\s]/.test(last)) {
          insert(")");
        } else {
          insert("(");
        }
        break;
      case "pi": insert("π"); break;
      case "e": insert("e"); break;
      case "ans": insert("Ans"); break;
      case "sin": wrapFunction("sin"); break;
      case "cos": wrapFunction("cos"); break;
      case "tan": wrapFunction("tan"); break;
      case "asin": wrapFunction("asin"); break;
      case "acos": wrapFunction("acos"); break;
      case "atan": wrapFunction("atan"); break;
      case "ln": wrapFunction("ln"); break;
      case "log": wrapFunction("log"); break;
      case "sqrt": insert("√"); break;
      case "cbrt": insert("∛"); break;
      case "abs": insert("|"); break;
      case "pow2":
        if (justEvaluated) { expr = "Ans^2"; justEvaluated = false; }
        else expr += "^2";
        updateDisplay();
        break;
      case "exp":
        if (justEvaluated) { expr = "e^(Ans"; justEvaluated = false; }
        else expr += "e^(";
        updateDisplay();
        break;
      case "fact": insert("!"); break;
      case "inv":
        if (justEvaluated) { expr = "1/(Ans"; justEvaluated = false; }
        else {
          var m = expr.match(/(\d+\.?\d*|π|e|Ans)$/);
          if (m) expr = expr.slice(0, expr.length - m[1].length) + "1/(" + m[1];
          else expr += "1/(";
        }
        updateDisplay();
        break;
      case "sign":
        // toggle sign of last number or wrap whole expression
        if (justEvaluated) { expr = "-Ans"; justEvaluated = false; updateDisplay(); break; }
        var mm = expr.match(/(\d+\.?\d*|π|e|Ans)$/);
        if (mm) {
          var start = expr.length - mm[1].length;
          var before = expr.slice(0, start);
          if (before.endsWith("-") && (start === 0 || /[+\-*/^(%]/.test(before.slice(-2, -1)))) {
            // remove the minus
            expr = before.slice(0, -1) + mm[1];
          } else {
            expr = before + "-" + mm[1];
          }
        } else {
          expr += "-";
        }
        updateDisplay();
        break;
      case "del": backspace(); break;
      case "clear": clearAll(); break;
      case "eq": compute(); break;
      case "deg":
        degMode = !degMode;
        var btn = document.querySelector('[data-action="deg"]');
        btn.classList.toggle("active", degMode);
        btn.textContent = degMode ? "DEG" : "RAD";
        updateDisplay();
        break;
      case "mc": memory = 0; updateDisplay(); break;
      case "mr": insert(formatNumber(memory).replace(/−/g, "-")); break;
      case "mplus":
        var v1 = currentValue();
        if (v1 !== null) memory += v1;
        updateDisplay();
        break;
      case "mminus":
        var v2 = currentValue();
        if (v2 !== null) memory -= v2;
        updateDisplay();
        break;
    }
  }

  // ---------- Event wiring ----------
  document.getElementById("keys").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    applyAction(btn.dataset.action);
  });

  degBadge.addEventListener("click", function () { applyAction("deg"); });
  histBadge.addEventListener("click", function () { applyAction("ans"); });
  memBadge.addEventListener("click", function () {
    if (memory !== 0) applyAction("mr");
  });

  // Keyboard support
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k >= "0" && k <= "9") { applyAction(k); e.preventDefault(); return; }
    switch (k) {
      case ".": applyAction("dot"); break;
      case "+": applyAction("add"); break;
      case "-": applyAction("sub"); break;
      case "*": applyAction("mul"); break;
      case "/": applyAction("div"); break;
      case "^": applyAction("pow"); break;
      case "%": applyAction("percent"); break;
      case "(": case ")": applyAction("paren"); break;
      case "!": applyAction("fact"); break;
      case "Enter": case "=": applyAction("eq"); break;
      case "Backspace": applyAction("del"); break;
      case "Escape": applyAction("clear"); break;
      case "p": applyAction("pi"); break;
      default: return;
    }
    e.preventDefault();
  });

  updateDisplay();
})();
</script>
</body>
</html>
